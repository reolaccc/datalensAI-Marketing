services:
  - type: web
    name: datalens-api
    runtime: node
    buildCommand: npm install && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0

  - type: web
    name: datalens-web
    runtime: static
    buildCommand: npm install && npm run build --workspace frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: datalens-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
